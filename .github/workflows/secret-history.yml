name: Secret history audit

on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * 0'

permissions:
  contents: read

jobs:
  history:
    name: Audit Git history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history and Juice Shop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Scan repository history
        run: |
          mkdir -p security-reports
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo" \
            docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
            --config /repo/.gitleaks.toml \
            --log-opts=--all \
            --report-format json \
            --report-path /repo/security-reports/gitleaks-history.json \
            --redact \
            --exit-code 1
      - name: Redact report fields before sharing
        if: always()
        run: python scripts/redact_gitleaks.py security-reports/gitleaks-history.json
      - name: Summarize historical findings
        if: always() && hashFiles('security-reports/gitleaks-history.json') != ''
        run: python scripts/gitleaks_summary.py security-reports/gitleaks-history.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted history report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-history-report
          path: security-reports/gitleaks-history.json
          if-no-files-found: warn
          retention-days: 14
