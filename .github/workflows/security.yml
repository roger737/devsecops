name: Security gates

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository and Juice Shop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --requirement security/requirements.txt
      - name: Check suppression ownership and expiry
        run: python scripts/check_exception_expiry.py security juice-shop
      - name: Test custom rules
        run: python scripts/test_semgrep_rules.py
      - name: Verify documented false-positive suppression
        run: semgrep scan --config security/semgrep/rules.yml --metrics=off --error security/semgrep/examples/false-positive.ts
      - name: Scan Juice Shop
        id: scan
        shell: bash
        run: |
          mkdir -p security-reports
          set +e
          semgrep scan \
            --config security/semgrep/rules.yml \
            --config p/javascript \
            --config p/typescript \
            --severity ERROR \
            --metrics=off \
            --jobs 2 \
            --timeout 60 \
            --error \
            --json-output=security-reports/semgrep.json \
            --sarif-output=security-reports/semgrep.sarif \
            --text-output=security-reports/semgrep.txt \
            juice-shop
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
      - name: Summarize findings and verify real detections
        if: always() && hashFiles('security-reports/semgrep.json') != ''
        run: python scripts/semgrep_summary.py security-reports/semgrep.json --require-juice-shop-findings | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Semgrep findings to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        with:
          sarif_file: security-reports/semgrep.sarif
          category: semgrep
      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sast-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce High/Critical SAST gate
        if: steps.scan.outputs.exit_code == '1'
        run: |
          echo "High-severity static analysis findings block this change. See the summary and SAST artifact." >&2
          exit 1

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and Juice Shop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Scan current tree for secrets
        run: |
          mkdir -p security-reports
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo" \
            --workdir /repo \
            docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path security-reports/gitleaks.json \
            --redact \
            --exit-code 1
      - name: Redact report fields before sharing
        if: always()
        run: python scripts/redact_gitleaks.py security-reports/gitleaks.json
      - name: Summarize secret findings
        if: always() && hashFiles('security-reports/gitleaks.json') != ''
        run: |
          python scripts/gitleaks_summary.py security-reports/gitleaks.json | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json

          with open('security-reports/gitleaks.json', encoding='utf-8') as report:
              findings = json.load(report)
          if findings:
              locations = ', '.join(f"{item['File']}:{item['StartLine']}" for item in findings[:5])
              print(f'::error title=Additional secret findings::{len(findings)} finding(s): {locations}')
          PY
      - name: Upload redacted secret report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-report
          path: security-reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    name: Dependencies and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository and Juice Shop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve exact dependency versions without running package scripts
        run: |
          mkdir -p security-reports
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix juice-shop
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix juice-shop/frontend
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9
        with:
          path: juice-shop
          format: cyclonedx-json
          output-file: security-reports/juice-shop-sbom.cdx.json
          syft-version: v1.57.1
          dependency-snapshot: 'false'
          upload-artifact: 'false'
          upload-release-assets: 'false'
      - name: Scan dependencies for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: juice-shop
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: security-reports/trivy-dependencies.json
          version: v0.76.2
          cache: 'false'
          timeout: 15m
      - name: Create readable dependency report
        if: always()
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --format table --output security-reports/trivy-dependencies.txt --exit-code 0 juice-shop
          {
            echo '## Dependency vulnerabilities (High/Critical)'
            echo '```text'
            cat security-reports/trivy-dependencies.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create dependency SARIF report
        if: always()
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --format sarif --output security-reports/trivy-dependencies.sarif --exit-code 0 juice-shop
      - name: Upload dependency findings to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('security-reports/trivy-dependencies.sarif') != ''
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        with:
          sarif_file: security-reports/trivy-dependencies.sarif
          category: trivy-dependencies
      - name: Upload dependency reports and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-reports-and-sbom
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Hardened container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository and Juice Shop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build hardened image
        run: |
          docker build \
            --file Dockerfile \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg VCS_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "juice-shop:hardened-$GITHUB_SHA" \
            juice-shop
      - name: Verify non-root runtime user
        run: |
          runtime_user="$(docker image inspect "juice-shop:hardened-$GITHUB_SHA" --format '{{.Config.User}}')"
          echo "Configured runtime user: $runtime_user"
          test "$runtime_user" = '65532:0'
      - name: Start hardened container and verify HTTP response
        id: smoke
        run: |
          docker run --detach \
            --name juice-shop \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3000:3000 \
            "juice-shop:hardened-$GITHUB_SHA"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              echo "Juice Shop returned a successful HTTP response on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "Juice Shop did not become ready." >&2
          exit 1
      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p security-reports
          {
            echo "Container HTTP smoke outcome: ${{ steps.smoke.outcome }}"
            docker ps --all --filter name=juice-shop
            docker logs juice-shop
          } > security-reports/container-smoke.txt 2>&1 || true
      - name: Scan image OS and application packages
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          image-ref: juice-shop:hardened-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: security-reports/trivy-image.json
          version: v0.76.2
          cache: 'false'
          timeout: 15m
      - name: Create readable image report
        if: always()
        run: |
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format table --output security-reports/trivy-image.txt --exit-code 0 "juice-shop:hardened-$GITHUB_SHA"
          {
            echo '## Image vulnerabilities (High/Critical)'
            echo '```text'
            cat security-reports/trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create image SARIF report
        if: always()
        run: trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format sarif --output security-reports/trivy-image.sarif --exit-code 0 "juice-shop:hardened-$GITHUB_SHA"
      - name: Upload image findings to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('security-reports/trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        with:
          sarif_file: security-reports/trivy-image.sarif
          category: trivy-image
      - name: Upload image and runtime reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify
    if: always()
    needs: [sast, secrets, dependencies, container]
    runs-on: ubuntu-latest
    env:
      NEEDS_RESULTS: ${{ toJson(needs) }}
    steps:
      - name: Aggregate required security gates
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['NEEDS_RESULTS'])
          for name, value in results.items():
              print(f"{name}: {value['result']}")
          failed = [name for name, value in results.items() if value['result'] != 'success']
          if failed:
              print('Blocking security gates: ' + ', '.join(failed), file=sys.stderr)
              sys.exit(1)
          print('All security gates passed.')
          PY
